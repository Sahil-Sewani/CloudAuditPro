apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudauditpro-backend
  namespace: cloudauditpro-dev
  labels:
    app: cloudauditpro-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cloudauditpro-backend
  template:
    metadata:
      labels:
        app: cloudauditpro-backend
    spec:
      containers:
        - name: backend
          image: cloudauditpro-backend:local
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: APP_ENV
              value: kubernetes-local
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
